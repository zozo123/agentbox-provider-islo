name: Publish slim runtime image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/Dockerfile
      - .github/workflows/runtime-image.yml

permissions:
  contents: read
  packages: write

env:
  # Single source of truth: the same value tags the image AND is passed as the
  # Dockerfile's AGENTBOX_VERSION, so the baked agentbox-ctl can never drift
  # from the tag that advertises it.
  AGENTBOX_VERSION: 0.24.6

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          # islo microVMs are x86_64 (AMD EPYC); an arm64 variant is never pulled.
          platforms: linux/amd64
          push: true
          build-args: |
            AGENTBOX_VERSION=${{ env.AGENTBOX_VERSION }}
          tags: |
            ghcr.io/zozo123/agentbox-islo-runtime:${{ env.AGENTBOX_VERSION }}
            ghcr.io/zozo123/agentbox-islo-runtime:latest
          labels: |
            org.opencontainers.image.source=https://github.com/zozo123/agentbox-provider-islo
            org.opencontainers.image.description=Slim AgentBox runtime for islo microVMs
