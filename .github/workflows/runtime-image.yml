name: Publish slim runtime image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/Dockerfile
      - .github/workflows/runtime-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zozo123/agentbox-islo-runtime:0.24.6
            ghcr.io/zozo123/agentbox-islo-runtime:latest
          labels: |
            org.opencontainers.image.source=https://github.com/zozo123/agentbox-provider-islo
            org.opencontainers.image.description=Slim AgentBox runtime for islo microVMs
